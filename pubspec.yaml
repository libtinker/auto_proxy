name: auto_proxy
description: "A Flutter plugin to automatically detect and retrieve the system HTTP proxy settings on Android and iOS."
version: 0.0.1
homepage: "https://github.com/libtinker/auto_proxy"
repository: "https://github.com/libtinker/auto_proxy.git"

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.tiankongxiyinwo.auto_proxy
        pluginClass: AutoProxyPlugin
      ios:
        pluginClass: AutoProxyPlugin


  
